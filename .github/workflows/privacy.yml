name: Public snapshot privacy checks
on:
  push:
  pull_request:
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check demo data and personal file exclusions
        run: python3 scripts/check_public_snapshot.py
      - name: Run the eval graders' tests
        run: python3 -m unittest discover -s evals/tests
